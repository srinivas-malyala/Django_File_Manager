{% extends "base/base.html" %}

{% block title %}Change password | Enterprise File Manager{% endblock %}

{% block content %}
  <div class="auth-shell">
  <div class="row justify-content-center w-100 mx-0">
    <div class="col-lg-6">
      <div class="card auth-card">
        <div class="card-body">
          <div class="auth-icon">••</div>
          <div class="page-eyebrow">Account security</div>
          <h1 class="h2 mb-2">Change password</h1>
          <p class="text-body-secondary mb-4">Choose a strong password you do not use elsewhere.</p>
          <form method="post">
            {% csrf_token %}
            {% include "auth/form_fields.html" %}
            <button class="btn btn-primary" type="submit">Update password</button>
          </form>
        </div>
      </div>
    </div>
  </div>
  </div>
{% endblock %}
