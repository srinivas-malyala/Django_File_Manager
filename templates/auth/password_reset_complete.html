{% extends "base/base.html" %}

{% block title %}Password reset complete | Enterprise File Manager{% endblock %}

{% block content %}
  <div class="auth-shell">
  <div class="row justify-content-center w-100 mx-0">
    <div class="col-lg-6">
      <div class="card auth-card">
        <div class="card-body">
          <div class="auth-icon">✓</div>
          <div class="page-eyebrow">All set</div>
          <h1 class="h2 mb-2">Password reset complete</h1>
          <p class="text-body-secondary">Your password has been updated. You can now sign in.</p>
          <a class="btn btn-primary" href="{% url 'accounts:login' %}">Sign in</a>
        </div>
      </div>
    </div>
  </div>
  </div>
{% endblock %}
