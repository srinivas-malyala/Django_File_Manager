{% extends "base/base.html" %}

{% block title %}Reset email requested | Enterprise File Manager{% endblock %}

{% block content %}

  <div class="row justify-content-center w-100 mx-0">
    <div class="col-lg-6">
      <div class="card auth-card">
        <div class="card-body">
          <div class="auth-icon">@</div>
          <div class="page-eyebrow">Reset requested</div>
          <h1 class="h2 mb-2">Check your email</h1>

          </p>
        </div>
      </div>
    </div>
  </div>
  </div>
{% endblock %}
