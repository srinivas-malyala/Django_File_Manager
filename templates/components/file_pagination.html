{% if is_paginated %}
  <nav class="mt-4" aria-label="File list pages">
    <ul class="pagination justify-content-center flex-wrap">
      {% if page_obj.has_previous %}
        <li class="page-item">
          <a class="page-link" href="?{% if pagination_query %}{{ pagination_query }}&amp;{% endif %}page={{ page_obj.previous_page_number }}">Previous</a>
        </li>
      {% endif %}
      <li class="page-item active">
        <span class="page-link">Page {{ page_obj.number }} of {{ paginator.num_pages }}</span>
      </li>
      {% if page_obj.has_next %}
        <li class="page-item">
          <a class="page-link" href="?{% if pagination_query %}{{ pagination_query }}&amp;{% endif %}page={{ page_obj.next_page_number }}">Next</a>
        </li>
      {% endif %}
    </ul>
  </nav>
{% endif %}
